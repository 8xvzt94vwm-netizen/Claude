<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Future Dads Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700&family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,600&display=block" rel="stylesheet">
<style>
  /*
    Pre-pregnancy series · Story 03 — 1080 x 1920, 8s
    Mild pink base + dusty blue "dad" accent.
    Safe zones: top ~250px (profile bar), bottom ~240px (reply bar).
    Question-sticker zone left clear: y ≈ 1400 – 1690.
  */
  :root {
    --ink: #3A2540;
    --ink-soft: #8A6F86;
    --rose: #C04A73;
    --pink: #F2B3C4;
    --pink-2: #F7CCD8;
    --pink-3: #FCEBF0;
    --blue: #3D5A80;       /* dad accent, deep */
    --blue-2: #8FA8C8;     /* dad accent, dusty */
    --blue-3: #C9D6E6;
    --marker: #F8D0DB;
    --ease-out: cubic-bezier(.16, 1, .3, 1);
    --ease-pop: cubic-bezier(.34, 1.56, .64, 1);
    --ease-io: cubic-bezier(.65, 0, .35, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #FFF9FA; }

  .stage {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: linear-gradient(180deg, #FFFAFB 0%, #FDF1F4 50%, #F9E6EC 100%);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- background ---------- */
  .blob { position: absolute; border-radius: 50%; }
  .b1 { width: 860px; height: 860px; right: -360px; top: -320px;
        background: radial-gradient(circle, rgba(201,214,230,.6) 0%, rgba(201,214,230,0) 68%);
        animation: drift1 9s ease-in-out infinite alternate; }
  .b2 { width: 780px; height: 780px; left: -420px; top: 640px;
        background: radial-gradient(circle, rgba(247,204,216,.7) 0%, rgba(247,204,216,0) 68%);
        animation: drift2 10s ease-in-out infinite alternate; }
  .b3 { width: 940px; height: 940px; right: -340px; bottom: -420px;
        background: radial-gradient(circle, rgba(242,179,196,.42) 0%, rgba(242,179,196,0) 68%);
        animation: drift3 11s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(-70px, 60px) scale(1.08); } }
  @keyframes drift2 { to { transform: translate(80px, -50px) scale(1.06); } }
  @keyframes drift3 { to { transform: translate(-60px, -70px) scale(1.05); } }

  .ring { position: absolute; width: 380px; height: 380px; right: -170px; top: 1360px;
          border: 2px solid rgba(61,90,128,.13); border-radius: 50%;
          animation: ringIn 1.4s var(--ease-out) .3s both, spin 24s linear infinite; }
  .ring::after { content: ""; position: absolute; width: 16px; height: 16px; border-radius: 50%;
                 background: var(--blue-2); top: 46px; left: 46px; }
  @keyframes ringIn { from { opacity: 0; scale: .7; } to { opacity: 1; scale: 1; } }
  @keyframes spin { to { rotate: 360deg; } }

  /* ---------- shared motion ---------- */
  @keyframes pop  { from { transform: scale(0); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes rise { from { transform: translateY(110%) rotate(5deg); } to { transform: none; } }
  @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes write { from { clip-path: inset(-20% 100% -20% 0); } to { clip-path: inset(-20% -5% -20% 0); } }
  @keyframes bob  { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-14px) rotate(5deg); } }
  @keyframes twinkle { 0%,100% { transform: scale(1) rotate(0); } 50% { transform: scale(.7) rotate(45deg); } }
  .drawn { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw var(--dur, .5s) var(--ease-io) var(--d) both; }

  /* ---------- homework card ---------- */
  .note { position: absolute; left: 92px; top: 262px; width: 430px; transform: rotate(-5deg); }
  .note-in { position: relative; background: #fff; border-radius: 30px; padding: 34px 32px 28px 66px;
             box-shadow: 0 34px 60px -26px rgba(61,90,128,.32), 0 0 0 2px rgba(201,214,230,.45);
             transform-origin: 50% 90%; animation: cardIn .9s var(--ease-pop) .1s both; }
  @keyframes cardIn { from { transform: translateY(80px) scale(.6) rotate(-10deg); opacity: 0; }
                      to   { transform: none; opacity: 1; } }
  .note-in::before { content: ""; position: absolute; left: 44px; top: 0; bottom: 0; width: 3px;
                     background: var(--pink-2); }
  .tape { position: absolute; left: 50%; top: -22px; width: 150px; height: 44px; margin-left: -75px;
          background: rgba(242,179,196,.72); transform: rotate(3deg); border-radius: 4px; }
  .tape::before, .tape::after { content: ""; position: absolute; top: 0; bottom: 0; width: 8px;
          background: repeating-linear-gradient(180deg, transparent 0 6px, #fff 6px 9px); opacity: .7; }
  .tape::before { left: -4px; } .tape::after { right: -4px; }
  .hw { font: 700 22px/1 "DM Sans", sans-serif; letter-spacing: .24em; color: var(--blue-2); }
  .name { position: relative; display: flex; align-items: baseline; gap: 14px; margin-top: 16px;
          padding-bottom: 12px; border-bottom: 3px solid var(--pink-3); }
  .name .lbl { font: 600 26px/1 "DM Sans", sans-serif; color: #B9A3B4; }
  .hand { font-family: "Caveat", cursive; font-weight: 700; font-size: 60px; line-height: 1; }
  .her { position: relative; color: #E07A9A; }
  .her svg { position: absolute; left: -8px; top: 8px; width: calc(100% + 16px); height: 50px; overflow: visible; }
  .us { color: var(--blue); margin-left: 6px; animation: write .8s var(--ease-io) 2.15s both; }
  .checks { margin-top: 18px; display: grid; gap: 14px; }
  .row { display: flex; align-items: center; gap: 18px; }
  .box { position: relative; width: 32px; height: 32px; border-radius: 9px; border: 3px solid #E3D3DA; flex: none; }
  .box svg { position: absolute; left: -4px; top: -10px; width: 46px; height: 46px; overflow: visible; }
  .bar { height: 14px; border-radius: 7px; background: #F3E8EC; }

  /* ---------- dad + baby shoes ---------- */
  .shoes { position: absolute; left: 566px; top: 366px; width: 440px; height: 240px; }
  .shadow { position: absolute; left: 20px; right: 10px; bottom: 6px; height: 26px; border-radius: 50%;
            background: radial-gradient(ellipse, rgba(61,90,128,.22), rgba(61,90,128,0) 70%);
            animation: pop .8s var(--ease-out) .5s both; }
  .big { position: absolute; left: 0; bottom: 18px; width: 330px; height: 175px;
         animation: slideBig 1s var(--ease-out) .45s both; }
  @keyframes slideBig { from { transform: translateX(560px); } to { transform: none; } }
  .baby { position: absolute; left: 262px; bottom: 14px; width: 170px; height: 112px; transform-origin: 50% 100%;
          animation: hop 1.1s linear .95s both; }
  /* little hop-in from the right, squash on landing */
  @keyframes hop {
    0%   { transform: translate(260px, -10px) rotate(14deg); opacity: 0; animation-timing-function: cubic-bezier(.3,.6,.5,1); }
    10%  { opacity: 1; }
    40%  { transform: translate(110px, -120px) rotate(-6deg); animation-timing-function: cubic-bezier(.5,0,.8,.4); }
    66%  { transform: translate(0, 0) rotate(0) scale(1.08, .9); animation-timing-function: var(--ease-out); }
    82%  { transform: translate(0, -16px) scale(.97, 1.04); animation-timing-function: cubic-bezier(.5,0,.8,.4); }
    100% { transform: none; opacity: 1; }
  }
  .shoes svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .bigheart { position: absolute; left: 236px; top: -6px; width: 74px; height: 70px; }
  .bigheart > div { width: 100%; height: 100%; animation: pop .7s var(--ease-pop) 1.75s both; }
  .bigheart svg { animation: bob 3s ease-in-out 2.4s infinite; filter: drop-shadow(0 10px 14px rgba(192,74,115,.25)); }

  .spk { position: absolute; width: 44px; height: 44px; }
  .spk > div { width: 100%; height: 100%; animation: pop .7s var(--ease-pop) var(--d) both; }
  .spk svg { display: block; width: 100%; height: 100%; animation: twinkle 2.4s ease-in-out var(--t) infinite; }

  /* ---------- text ---------- */
  .text { position: absolute; left: 100px; right: 70px; top: 680px; }
  .line { display: block; overflow: hidden; padding: 0 .2em .1em; margin: 0 -.2em -.1em; }
  .in { display: inline-block; transform-origin: 0 100%; animation: rise .85s var(--ease-out) var(--d) both; }
  .mask { display: inline-block; overflow: hidden; vertical-align: top; padding: 0 .12em .14em; margin: 0 -.12em -.14em; }

  .dear { font-family: "Fraunces", serif; font-style: italic; font-weight: 500; font-size: 108px;
          line-height: 1.08; letter-spacing: -0.02em; color: var(--blue); white-space: nowrap;
          font-variation-settings: "opsz" 144; }
  .dots { display: inline-block; margin-left: -.04em; }
  .dots i { display: inline-block; font-style: inherit; transform-origin: 50% 85%;
            animation: pop .5s var(--ease-pop) var(--d) both; }

  .lead { margin-top: 26px; font-family: "DM Sans", sans-serif; font-weight: 600; font-size: 58px;
          line-height: 1.17; letter-spacing: -0.025em; color: var(--ink); font-variation-settings: "opsz" 40; }
  .hl { position: relative; display: inline-block; }
  .hl .tx { position: relative; }
  .mk { position: absolute; left: -.08em; right: -.06em; top: .5em; bottom: .04em; background: var(--marker);
        border-radius: .1em; transform-origin: 0 50%; animation: swipe .6s var(--ease-io) var(--d) both; }
  @keyframes swipe { from { transform: skewX(-8deg) scaleX(0); } to { transform: skewX(-8deg) scaleX(1); } }

  .q { margin-top: 30px; font-family: "Fraunces", serif; font-style: italic; font-weight: 600; font-size: 76px;
       line-height: 1.06; letter-spacing: -0.02em; color: var(--rose); font-variation-settings: "opsz" 144; }
  .q .line { padding: 0 .2em .12em; margin: 0 -.2em -.12em; }
  .one { position: relative; display: inline-block; font-style: normal; font-weight: 600; letter-spacing: .02em; }
  .one svg { position: absolute; left: -4%; width: 108%; bottom: -14px; height: 22px; overflow: visible; }

  /* ---------- sticker cue ---------- */
  .cue { position: absolute; left: 0; right: 0; top: 1294px;
         display: flex; flex-direction: column; align-items: center; gap: 10px;
         font: 700 30px/1 "DM Sans", sans-serif; letter-spacing: .22em; text-transform: uppercase;
         color: var(--ink-soft); animation: fadeUp .7s var(--ease-out) 3.5s both; }
  .cue svg { width: 40px; height: 40px; display: block; animation: drop 1.1s ease-in-out 4s infinite; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
  @keyframes drop { 0%,100% { transform: translateY(0); } 50% { transform: translateY(12px); } }
</style>
</head>
<body>
<div class="stage">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="ring"></div>

  <div class="spk" style="left:540px; top:282px; --t:1.6s"><div style="--d:1.0s">
    <svg viewBox="0 0 64 64"><path d="M32 2 C34 22 42 30 62 32 C42 34 34 42 32 62 C30 42 22 34 2 32 C22 30 30 22 32 2 Z" fill="#8FA8C8"/></svg>
  </div></div>
  <div class="spk" style="left:960px; top:330px; width:32px; height:32px; --t:2.1s"><div style="--d:1.3s">
    <svg viewBox="0 0 64 64"><path d="M32 2 C34 22 42 30 62 32 C42 34 34 42 32 62 C30 42 22 34 2 32 C22 30 30 22 32 2 Z" fill="#E07A9A"/></svg>
  </div></div>

  <!-- homework card: "Her" gets crossed out, "Us ♥" is written in, tasks get ticked -->
  <div class="note"><div class="note-in">
    <div class="tape"></div>
    <div class="hw">HOMEWORK</div>
    <div class="name">
      <span class="lbl">Name:</span>
      <span class="hand her">Her
        <svg viewBox="0 0 100 50" preserveAspectRatio="none">
          <path class="drawn" pathLength="1" style="--d:1.75s; --dur:.45s" d="M2 30 C30 22 70 26 98 18" stroke="#3D5A80" stroke-width="5" fill="none" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
        </svg>
      </span>
      <span class="hand us">Us ♥</span>
    </div>
    <div class="checks">
      <div class="row"><span class="box"><svg viewBox="0 0 46 46"><path class="drawn" pathLength="1" style="--d:2.65s; --dur:.35s" d="M8 24 L19 34 L40 8" stroke="#3D5A80" stroke-width="5.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="bar" style="width:210px"></span></div>
      <div class="row"><span class="box"><svg viewBox="0 0 46 46"><path class="drawn" pathLength="1" style="--d:2.9s; --dur:.35s" d="M8 24 L19 34 L40 8" stroke="#3D5A80" stroke-width="5.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="bar" style="width:160px"></span></div>
      <div class="row"><span class="box"><svg viewBox="0 0 46 46"><path class="drawn" pathLength="1" style="--d:3.15s; --dur:.35s" d="M8 24 L19 34 L40 8" stroke="#3D5A80" stroke-width="5.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="bar" style="width:240px"></span></div>
    </div>
  </div></div>

  <!-- dad's sneaker + baby shoe -->
  <div class="shoes">
    <div class="shadow"></div>
    <div class="big">
      <svg viewBox="0 0 330 175">
        <!-- sole -->
        <path d="M16 132 H296 C310 132 318 140 318 150 C318 161 310 168 296 168 H30 C20 168 12 162 12 152 V140 C12 135 13 132 16 132 Z" fill="#fff" stroke="#D3DCE7" stroke-width="3"/>
        <path d="M26 151 H302" stroke="#E6EBF2" stroke-width="5" stroke-linecap="round"/>
        <!-- upper -->
        <path d="M22 134 V60 C22 46 31 38 45 38 C62 38 74 50 94 50 C104 50 108 34 120 32 C131 30 137 39 146 48 C166 68 206 86 256 98 C292 106 312 116 314 134 Z" fill="#8FA8C8"/>
        <!-- heel panel -->
        <path d="M22 134 V60 C22 46 31 38 45 38 C54 38 60 42 64 47 C68 76 72 106 84 134 Z" fill="#7895BA"/>
        <!-- toe cap -->
        <path d="M240 94 C280 104 310 114 314 134 H232 C230 120 234 104 240 94 Z" fill="#B7C8DD"/>
        <!-- pink side stripe -->
        <path d="M96 118 C150 100 200 102 238 118" stroke="#F2B3C4" stroke-width="12" fill="none" stroke-linecap="round"/>
        <!-- collar lining -->
        <path d="M46 40 C62 40 74 52 94 52 C104 52 108 37 120 34" stroke="#5F7DA6" stroke-width="5" fill="none" stroke-linecap="round"/>
        <!-- laces -->
        <g stroke="#fff" stroke-width="6" stroke-linecap="round">
          <line x1="150" y1="62" x2="162" y2="46"/><line x1="170" y1="74" x2="182" y2="58"/>
          <line x1="190" y1="84" x2="202" y2="68"/><line x1="210" y1="92" x2="222" y2="77"/>
        </g>
        <!-- heel tab -->
        <rect x="14" y="54" width="14" height="36" rx="7" fill="#F2B3C4"/>
      </svg>
    </div>
    <div class="baby">
      <svg viewBox="0 0 170 112">
        <path d="M12 92 H152 C160 92 164 98 164 102 C164 107 160 110 152 110 H18 C12 110 8 106 8 101 C8 96 9 92 12 92 Z" fill="#fff" stroke="#EBD3DB" stroke-width="3"/>
        <path d="M14 94 C10 72 12 48 28 42 C40 38 52 44 62 52 C78 66 104 66 122 64 C144 64 158 76 160 94 Z" fill="#F4B9CA"/>
        <path d="M28 43 C40 39 52 45 62 53" stroke="#E596AE" stroke-width="6" fill="none" stroke-linecap="round"/>
        <path d="M56 50 C72 40 94 42 106 52 L101 62 C90 54 72 54 60 60 Z" fill="#EC9DB6"/>
        <circle cx="100" cy="57" r="6" fill="#fff"/>
        <ellipse cx="136" cy="78" rx="12" ry="6" fill="#fff" opacity=".45" transform="rotate(-12 136 78)"/>
      </svg>
    </div>
    <div class="bigheart"><div>
      <svg viewBox="0 0 100 94">
        <defs><linearGradient id="hG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7C2D1"/><stop offset="1" stop-color="#E07A9A"/></linearGradient></defs>
        <path d="M50 90 C20 68 4 50 4 31 C4 16 15 5 29 5 C38.5 5 46 10.5 50 18.5 C54 10.5 61.5 5 71 5 C85 5 96 16 96 31 C96 50 80 68 50 90 Z" fill="url(#hG)"/>
        <ellipse cx="27" cy="27" rx="10" ry="6.5" transform="rotate(-35 27 27)" fill="#fff" opacity=".55"/>
      </svg>
    </div></div>
  </div>

  <!-- text -->
  <div class="text">
    <h1 class="dear">
      <span class="mask"><span class="w in" style="--d:.30s">Dear</span></span>
      <span class="mask"><span class="w in" style="--d:.40s">future</span></span>
      <span class="mask"><span class="w in" style="--d:.50s">dads</span></span><span class="dots"><i style="--d:.86s">.</i><i style="--d:.98s">.</i><i style="--d:1.10s">.</i></span>
    </h1>
    <p class="lead">
      <span class="line"><span class="in" style="--d:1.20s">Pregnancy planning isn’t</span></span>
      <span class="line"><span class="in" style="--d:1.32s">just <span class="hl"><span class="mk" style="--d:1.75s"></span><span class="tx">her homework!</span></span></span></span>
    </p>
    <p class="q">
      <span class="line"><span class="in" style="--d:2.20s">What’s <span class="one">ONE<svg viewBox="0 0 120 22" preserveAspectRatio="none"><path class="drawn" pathLength="1" style="--d:2.95s; --dur:.5s" d="M3 14 C20 6 32 18 48 11 C64 4 76 18 92 11 C102 7 110 9 117 12" stroke="#8FA8C8" stroke-width="5" fill="none" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg></span> thing your</span></span>
      <span class="line"><span class="in" style="--d:2.34s">partner could do to make</span></span>
      <span class="line"><span class="in" style="--d:2.48s">this journey easier?</span></span>
    </p>
  </div>

  <div class="cue">
    <span>Tell us below</span>
    <svg viewBox="0 0 40 40" fill="none"><path d="M10 15 L20 25 L30 15" stroke="#C04A73" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
</div>
</body>
</html>
