<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Three Months Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700&family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,600&display=block" rel="stylesheet">
<style>
  /*
    Pre-pregnancy series · Story 02 — 1080 x 1920, 8s, baby pink theme
    Safe zones: top ~250px (profile bar), bottom ~260px (reply bar).
    Sticker zone left clear: y ≈ 1400 – 1690 (poll / question sticker).
  */
  :root {
    --plum: #4A1D36;
    --plum-soft: #8A5A73;
    --deep: #C2185B;        /* deep pink accent */
    --pink: #F48FB1;        /* baby pink, strong */
    --pink-2: #F7A6C1;
    --pink-3: #FCE4EC;      /* baby pink, light */
    --marker: #F9B4CA;
    --ease-out: cubic-bezier(.16, 1, .3, 1);
    --ease-pop: cubic-bezier(.34, 1.56, .64, 1);
    --ease-io: cubic-bezier(.65, 0, .35, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #FFF0F5; }

  .stage {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: linear-gradient(180deg, #FFF3F7 0%, #FDE4EC 48%, #F9D2DF 100%);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- background ---------- */
  .blob { position: absolute; border-radius: 50%; }
  .b1 { width: 860px; height: 860px; right: -340px; top: -300px;
        background: radial-gradient(circle, rgba(247,166,193,.62) 0%, rgba(247,166,193,0) 68%);
        animation: drift1 9s ease-in-out infinite alternate; }
  .b2 { width: 780px; height: 780px; left: -400px; top: 700px;
        background: radial-gradient(circle, rgba(255,214,226,.95) 0%, rgba(255,214,226,0) 68%);
        animation: drift2 10s ease-in-out infinite alternate; }
  .b3 { width: 940px; height: 940px; right: -320px; bottom: -400px;
        background: radial-gradient(circle, rgba(240,170,205,.55) 0%, rgba(240,170,205,0) 68%);
        animation: drift3 11s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(-70px, 60px) scale(1.08); } }
  @keyframes drift2 { to { transform: translate(80px, -50px) scale(1.06); } }
  @keyframes drift3 { to { transform: translate(-60px, -70px) scale(1.05); } }

  .ring { position: absolute; width: 380px; height: 380px; left: -170px; top: 1330px;
          border: 2px solid rgba(194,24,91,.14); border-radius: 50%;
          animation: ringIn 1.4s var(--ease-out) .3s both, spin 24s linear infinite; }
  .ring::after { content: ""; position: absolute; width: 16px; height: 16px; border-radius: 50%;
                 background: var(--deep); opacity: .45; top: 46px; right: 46px; }
  @keyframes ringIn { from { opacity: 0; scale: .7; } to { opacity: 1; scale: 1; } }
  @keyframes spin { to { rotate: 360deg; } }

  /* ---------- shared motion ---------- */
  @keyframes pop  { from { transform: scale(0); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes rise { from { transform: translateY(110%) rotate(5deg); } to { transform: none; } }
  @keyframes bob  { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-16px) rotate(4deg); } }
  @keyframes bob2 { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(14px) rotate(-6deg); } }
  @keyframes twinkle { 0%,100% { transform: scale(1) rotate(0); } 50% { transform: scale(.7) rotate(45deg); } }

  /* ---------- calendar card ---------- */
  .cal { position: absolute; left: 96px; top: 300px; width: 360px; transform: rotate(-6deg); }
  .cal-in { position: relative; background: #fff; border-radius: 38px; padding-bottom: 30px;
            box-shadow: 0 34px 60px -24px rgba(194,24,91,.35), 0 0 0 2px rgba(244,143,177,.18);
            transform-origin: 50% 80%;
            animation: cardIn .9s var(--ease-pop) .1s both; }
  @keyframes cardIn { from { transform: translateY(80px) scale(.6) rotate(-10deg); opacity: 0; }
                      to   { transform: none; opacity: 1; } }
  .rings i { position: absolute; top: -26px; width: 20px; height: 56px; border-radius: 10px;
             background: var(--plum); z-index: 2; }
  .rings i:first-child { left: 84px; } .rings i:last-child { right: 84px; }
  .cal-head { height: 104px; border-radius: 38px 38px 0 0;
              background: linear-gradient(135deg, #F8AECA 0%, #F27DA6 100%);
              display: flex; align-items: center; justify-content: center; gap: 16px; color: #fff; }
  .cal-head .lbl { font: 700 28px/1 "DM Sans", sans-serif; letter-spacing: .22em; margin-top: 6px; }
  .odo { height: 62px; overflow: hidden; font: italic 600 62px/62px "Fraunces", serif;
         font-variation-settings: "opsz" 144; }
  .odo-col { display: block; animation: odo 2.2s linear 0s both; }
  .odo-col span { display: block; height: 62px; text-align: center; }
  /* digit rolls 1 → 2 → 3 in sync with the days filling */
  @keyframes odo {
    0%, 62.7%   { transform: translateY(0);      animation-timing-function: var(--ease-io); }
    71.8%, 83.6%{ transform: translateY(-62px);  animation-timing-function: var(--ease-io); }
    92.7%, 100% { transform: translateY(-124px); }
  }
  .grid { display: grid; grid-template-columns: repeat(7, 34px); gap: 10px; padding: 28px 31px 0; }
  .cell { width: 34px; height: 34px; border-radius: 11px; background: var(--pink-3); position: relative; }
  .cell b { position: absolute; inset: 0; border-radius: 11px; background: var(--pink-2);
            animation: pop .38s var(--ease-pop) var(--d) both; }
  .cell.day { background: transparent; border: 3px dashed var(--pink-2); }
  .cell.day svg { position: absolute; inset: -6px; width: 46px; height: 46px; overflow: visible;
                  animation: pop .6s var(--ease-pop) var(--d) both; }
  .cell.day .pulse { position: absolute; inset: -4px; border-radius: 50%; border: 3px solid var(--deep);
                     opacity: 0; animation: pulse 1.4s ease-out var(--d) infinite; }
  @keyframes pulse { from { transform: scale(.6); opacity: .8; } to { transform: scale(2.1); opacity: 0; } }

  /* ---------- pregnancy test ---------- */
  .stick { position: absolute; left: 380px; top: 478px; width: 620px; height: 134px; transform: rotate(-27deg); }
  .stick-in { width: 100%; height: 100%;
              animation: slideIn 1.1s var(--ease-out) .35s both; }
  @keyframes slideIn { from { transform: translateX(760px) rotate(8deg); opacity: 0; } 30% { opacity: 1; }
                       to { transform: none; opacity: 1; } }
  .stick-float { width: 100%; height: 100%; animation: float 3.2s ease-in-out 1.45s infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .stick svg { width: 100%; height: 100%; overflow: visible; display: block;
               filter: drop-shadow(0 26px 30px rgba(194,24,91,.22)); }
  .stick svg * { transform-box: fill-box; transform-origin: 50% 50%; }
  .wick  { transform-origin: 0 50% !important;
           animation: sweep .7s var(--ease-io) 1.45s both, fadeOut .5s ease 2.25s both; }
  @keyframes sweep { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes fadeOut { to { opacity: 0; } }
  .lineC { animation: lineIn .45s var(--ease-out) 2.05s both; }
  .lineT { animation: lineIn 1.0s ease-out 2.85s both; }
  @keyframes lineIn { from { opacity: 0; transform: scaleY(.2); } to { opacity: 1; transform: none; } }
  .mini-heart { animation: pop .6s var(--ease-pop) 3.35s both; }
  .burst circle, .burst path { animation: burst .9s var(--ease-out) var(--d) both; }
  @keyframes burst { 0% { transform: translate(0,0) scale(0); opacity: 0; }
                     15% { opacity: 1; }
                     70% { opacity: 1; }
                     100% { transform: translate(var(--x), var(--y)) scale(1); opacity: 0; } }

  /* ---------- floating props ---------- */
  .prop { position: absolute; }
  .prop > div { animation: pop .7s var(--ease-pop) var(--d) both; }
  .prop svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .heart { left: 838px; top: 248px; width: 120px; height: 112px; }
  .heart svg { animation: bob 3s ease-in-out 1.5s infinite; filter: drop-shadow(0 16px 20px rgba(194,24,91,.25)); }
  .pill  { left: 96px; top: 712px; width: 150px; height: 64px; transform: rotate(-24deg); }
  .pill svg { animation: bob2 3.4s ease-in-out 1.6s infinite; filter: drop-shadow(0 14px 16px rgba(194,24,91,.2)); }
  .spk { width: 46px; height: 46px; }
  .spk svg { animation: twinkle 2.4s ease-in-out var(--t) infinite; }
  .prop > div, .prop svg { width: 100%; height: 100%; }

  /* ---------- text ---------- */
  .text { position: absolute; left: 100px; right: 80px; top: 822px; }
  .line { display: block; overflow: hidden; padding: 0 .2em .08em; margin: 0 -.2em -.08em; }
  .in { display: inline-block; transform-origin: 0 100%;
        animation: rise .85s var(--ease-out) var(--d) both; }
  .lead { font-family: "DM Sans", sans-serif; font-weight: 600; font-size: 68px; line-height: 1.17;
          letter-spacing: -0.025em; color: var(--plum); font-variation-settings: "opsz" 40; }
  .hl { position: relative; display: inline-block; color: var(--deep); font-weight: 700; }
  .hl .tx { position: relative; }
  .mk { position: absolute; left: -.08em; right: -.08em; top: .5em; bottom: .04em;
        background: var(--marker); border-radius: .1em; transform-origin: 0 50%;
        animation: swipe .6s var(--ease-io) var(--d) both; }
  @keyframes swipe { from { transform: skewX(-8deg) scaleX(0); } to { transform: skewX(-8deg) scaleX(1); } }
  .q { margin-top: 30px; font-family: "Fraunces", serif; font-style: italic; font-weight: 600;
       font-size: 108px; line-height: 1.04; letter-spacing: -0.025em; color: var(--deep);
       font-variation-settings: "opsz" 144; }
  .q .line { padding: 0 .2em .12em; margin: 0 -.2em -.12em; }

  /* ---------- sticker cue ---------- */
  .cue { position: absolute; left: 0; right: 0; top: 1316px;
         display: flex; flex-direction: column; align-items: center; gap: 10px;
         font: 700 30px/1 "DM Sans", sans-serif; letter-spacing: .22em; text-transform: uppercase;
         color: var(--plum-soft); animation: fadeUp .7s var(--ease-out) 3.4s both; }
  .cue svg { width: 40px; height: 40px; display: block; animation: drop 1.1s ease-in-out 3.9s infinite; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
  @keyframes drop { 0%,100% { transform: translateY(0); } 50% { transform: translateY(12px); } }
</style>
</head>
<body>
<div class="stage">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="ring"></div>

  <!-- sparkles -->
  <div class="prop spk" style="left:470px; top:250px; --t:1.4s"><div style="--d:.9s">
    <svg viewBox="0 0 64 64"><path d="M32 2 C34 22 42 30 62 32 C42 34 34 42 32 62 C30 42 22 34 2 32 C22 30 30 22 32 2 Z" fill="#C2185B"/></svg>
  </div></div>
  <div class="prop spk" style="left:960px; top:640px; width:34px; height:34px; --t:2s"><div style="--d:1.15s">
    <svg viewBox="0 0 64 64"><path d="M32 2 C34 22 42 30 62 32 C42 34 34 42 32 62 C30 42 22 34 2 32 C22 30 30 22 32 2 Z" fill="#F27DA6"/></svg>
  </div></div>

  <!-- calendar: days tick by, month counter rolls 1 → 3, heart lands on "the day" -->
  <div class="cal">
    <div class="cal-in">
      <div class="rings"><i></i><i></i></div>
      <div class="cal-head">
        <span class="lbl">MONTH</span>
        <span class="odo"><span class="odo-col"><span>1</span><span>2</span><span>3</span></span></span>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </div>

  <!-- pregnancy test -->
  <div class="stick"><div class="stick-in"><div class="stick-float">
    <svg viewBox="0 0 620 134">
      <defs>
        <clipPath id="win"><rect x="236" y="45" width="184" height="44" rx="22"/></clipPath>
        <linearGradient id="capG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#F9A9C5"/><stop offset="1" stop-color="#EE7AA2"/>
        </linearGradient>
      </defs>
      <!-- body -->
      <rect x="40" y="22" width="572" height="90" rx="45" fill="#fff" stroke="#EDC5D3" stroke-width="3"/>
      <rect x="60" y="28" width="530" height="14" rx="7" fill="#fff" opacity=".9"/>
      <!-- absorbent cap -->
      <rect x="4" y="12" width="158" height="110" rx="55" fill="url(#capG)"/>
      <g stroke="#fff" stroke-opacity=".55" stroke-width="6" stroke-linecap="round">
        <line x1="58" y1="36" x2="58" y2="98"/><line x1="80" y1="34" x2="80" y2="100"/><line x1="102" y1="36" x2="102" y2="98"/>
      </g>
      <rect x="150" y="18" width="18" height="98" rx="9" fill="#E8648F"/>
      <!-- result window -->
      <rect x="236" y="45" width="184" height="44" rx="22" fill="#F8EEF2" stroke="#E7C8D4" stroke-width="2.5"/>
      <g clip-path="url(#win)">
        <rect class="wick" x="236" y="45" width="184" height="44" fill="#F7A6C1" opacity=".45"/>
      </g>
      <rect class="lineT" x="300" y="52" width="11" height="30" rx="4" fill="#D63A72"/>
      <rect class="lineC" x="360" y="52" width="11" height="30" rx="4" fill="#C2185B"/>
      <text x="305.5" y="104" font-family="DM Sans" font-weight="700" font-size="13" fill="#D9AFC0" text-anchor="middle">T</text>
      <text x="365.5" y="104" font-family="DM Sans" font-weight="700" font-size="13" fill="#D9AFC0" text-anchor="middle">C</text>
      <!-- status dot -->
      <circle cx="476" cy="67" r="19" fill="#F8EEF2" stroke="#E7C8D4" stroke-width="2.5"/>
      <path class="mini-heart" d="M476 77 C468 71 464 67 464 62 C464 58.5 466.8 56 470 56 C472.6 56 474.6 57.6 476 59.8 C477.4 57.6 479.4 56 482 56 C485.2 56 488 58.5 488 62 C488 67 484 71 476 77 Z" fill="#D63A72"/>
      <!-- grip -->
      <g stroke="#F4D3DF" stroke-width="6" stroke-linecap="round">
        <line x1="540" y1="48" x2="540" y2="86"/><line x1="558" y1="48" x2="558" y2="86"/><line x1="576" y1="48" x2="576" y2="86"/>
      </g>
      <!-- celebration burst around the window -->
      <g class="burst">
        <circle cx="328" cy="67" r="7"  fill="#F27DA6" style="--d:3.25s; --x:-10px; --y:-120px"/>
        <circle cx="328" cy="67" r="5"  fill="#C2185B" style="--d:3.30s; --x:90px;  --y:-100px"/>
        <circle cx="328" cy="67" r="6"  fill="#F7A6C1" style="--d:3.28s; --x:-110px; --y:-80px"/>
        <circle cx="328" cy="67" r="5"  fill="#F27DA6" style="--d:3.33s; --x:140px; --y:-30px"/>
        <circle cx="328" cy="67" r="6"  fill="#C2185B" style="--d:3.31s; --x:-130px; --y:30px"/>
        <circle cx="328" cy="67" r="5"  fill="#F7A6C1" style="--d:3.35s; --x:60px;  --y:110px"/>
        <path d="M328 47 C329 60 333 64 346 65 C333 66 329 70 328 83 C327 70 323 66 310 65 C323 64 327 60 328 47 Z" fill="#C2185B" style="--d:3.27s; --x:40px; --y:-140px"/>
        <path d="M328 51 C329 61 332 64 342 65 C332 66 329 69 328 79 C327 69 324 66 314 65 C324 64 327 61 328 51 Z" fill="#F27DA6" style="--d:3.32s; --x:-60px; --y:120px"/>
      </g>
    </svg>
  </div></div></div>

  <!-- floating heart -->
  <div class="prop heart"><div style="--d:.7s">
    <svg viewBox="0 0 100 94">
      <defs><linearGradient id="hG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F9A3C1"/><stop offset="1" stop-color="#E24C80"/></linearGradient></defs>
      <path d="M50 90 C20 68 4 50 4 31 C4 16 15 5 29 5 C38.5 5 46 10.5 50 18.5 C54 10.5 61.5 5 71 5 C85 5 96 16 96 31 C96 50 80 68 50 90 Z" fill="url(#hG)"/>
      <ellipse cx="27" cy="27" rx="10" ry="6.5" transform="rotate(-35 27 27)" fill="#fff" opacity=".55"/>
    </svg>
  </div></div>

  <!-- prenatal vitamin capsule -->
  <div class="prop pill"><div style="--d:.85s">
    <svg viewBox="0 0 150 64">
      <rect x="3" y="3" width="144" height="58" rx="29" fill="#fff"/>
      <path d="M75 3 H32 A29 29 0 0 0 32 61 H75 Z" fill="#F48FB1"/>
      <rect x="3" y="3" width="144" height="58" rx="29" fill="none" stroke="#EDC5D3" stroke-width="3"/>
      <rect x="22" y="14" width="36" height="9" rx="4.5" fill="#fff" opacity=".6"/>
      <rect x="92" y="14" width="36" height="9" rx="4.5" fill="#F8D7E3"/>
    </svg>
  </div></div>

  <!-- text -->
  <div class="text">
    <p class="lead">
      <span class="line"><span class="in" style="--d:.80s">You decide to try</span></span>
      <span class="line"><span class="in" style="--d:.92s">for a baby in <span class="hl"><span class="mk" style="--d:1.65s"></span><span class="tx">3 months</span></span>…</span></span>
    </p>
    <p class="q">
      <span class="line"><span class="in" style="--d:2.05s">What’s the first</span></span>
      <span class="line"><span class="in" style="--d:2.20s">thing you’d do?</span></span>
    </p>
  </div>

  <div class="cue">
    <span>Tell us below</span>
    <svg viewBox="0 0 40 40" fill="none"><path d="M10 15 L20 25 L30 15" stroke="#C2185B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
</div>

<script>
  // Build the 5x7 calendar grid: days fill in sequence, a heart marks "the day".
  const grid = document.getElementById('grid');
  const START = 0.95, STEP = 0.042, DAY = 33;
  const heart = '<svg viewBox="0 0 100 94"><path d="M50 90 C20 68 4 50 4 31 C4 16 15 5 29 5 C38.5 5 46 10.5 50 18.5 C54 10.5 61.5 5 71 5 C85 5 96 16 96 31 C96 50 80 68 50 90 Z" fill="#C2185B"/></svg>';
  for (let i = 0; i < 35; i++) {
    const c = document.createElement('div');
    c.className = 'cell';
    if (i < DAY) {
      c.innerHTML = `<b style="--d:${(START + i * STEP).toFixed(3)}s"></b>`;
    } else if (i === DAY) {
      const d = (START + i * STEP + 0.2).toFixed(3);
      c.classList.add('day');
      c.innerHTML = `<span class="pulse" style="--d:${d}s"></span>` + heart.replace('<svg', `<svg style="--d:${d}s"`);
    }
    grid.appendChild(c);
  }
</script>
</body>
</html>
