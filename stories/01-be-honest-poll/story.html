<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Be Honest Poll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700&family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,600&display=block" rel="stylesheet">
<style>
  /*
    Instagram Story — 1080 x 1920, 7s
    Safe zones: top ~250px (profile bar), bottom ~280px (reply bar).
    Poll zone left clear: y ≈ 1360 – 1660.
  */
  :root {
    --plum: #3A1B2B;
    --plum-soft: #7A5468;
    --rose: #B4335A;
    --marker: #FDCFC3;
    --ease-out: cubic-bezier(.16, 1, .3, 1);
    --ease-pop: cubic-bezier(.34, 1.56, .64, 1);
    --ease-io: cubic-bezier(.65, 0, .35, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #FFF6F1; }

  .stage {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: linear-gradient(180deg, #FFF8F3 0%, #FEEFE8 50%, #FBE2D9 100%);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- soft drifting background shapes ---------- */
  .blob { position: absolute; border-radius: 50%; }
  .b1 { width: 820px; height: 820px; right: -330px; top: -260px;
        background: radial-gradient(circle, rgba(245,178,165,.75) 0%, rgba(245,178,165,0) 68%);
        animation: drift1 9s ease-in-out infinite alternate; }
  .b2 { width: 760px; height: 760px; left: -380px; top: 760px;
        background: radial-gradient(circle, rgba(253,214,190,.9) 0%, rgba(253,214,190,0) 68%);
        animation: drift2 10s ease-in-out infinite alternate; }
  .b3 { width: 900px; height: 900px; right: -300px; bottom: -380px;
        background: radial-gradient(circle, rgba(232,190,212,.7) 0%, rgba(232,190,212,0) 68%);
        animation: drift3 11s ease-in-out infinite alternate; }
  @keyframes drift1 { from { transform: translate(0,0) scale(1); } to { transform: translate(-70px, 60px) scale(1.08); } }
  @keyframes drift2 { from { transform: translate(0,0) scale(1); } to { transform: translate(80px, -50px) scale(1.06); } }
  @keyframes drift3 { from { transform: translate(0,0) scale(1); } to { transform: translate(-60px, -70px) scale(1.05); } }

  /* thin decorative ring */
  .ring { position: absolute; width: 340px; height: 340px; right: -110px; top: 210px;
          border: 2px solid rgba(180,51,90,.16); border-radius: 50%;
          animation: ringIn 1.4s var(--ease-out) .2s both, spin 24s linear infinite; }
  @keyframes ringIn { from { opacity: 0; scale: .7; } to { opacity: 1; scale: 1; } }
  @keyframes spin { to { rotate: 360deg; } }
  .ring::after { content: ""; position: absolute; width: 16px; height: 16px; border-radius: 50%;
                 background: var(--rose); opacity: .55; top: 40px; left: 40px; }

  /* ---------- content ---------- */
  .content { position: absolute; left: 100px; right: 90px; top: 285px; }

  .mask { display: inline-block; overflow: hidden; vertical-align: top;
          padding: 0 .12em .14em; margin: 0 -.12em -.14em; }

  .honest {
    font-family: "Fraunces", serif; font-style: italic; font-weight: 500;
    font-size: 138px; line-height: 1.08; letter-spacing: -0.02em; color: var(--plum);
    font-variation-settings: "opsz" 144;
    white-space: nowrap; position: relative;
  }
  .w { display: inline-block; transform-origin: 0 100%;
       animation: rise .9s var(--ease-out) var(--d) both; }
  @keyframes rise { from { transform: translateY(110%) rotate(5deg); } to { transform: none; } }

  .dots { display: inline-block; margin-left: -.04em; }
  .dots i { display: inline-block; font-style: inherit; transform-origin: 50% 85%;
            animation: pop .5s var(--ease-pop) var(--d) both; }
  @keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: none; opacity: 1; } }

  .spark { position: absolute; width: 64px; height: 64px; left: 572px; top: -6px;
           animation: sparkIn .7s var(--ease-pop) 1.0s both; }
  .spark svg { width: 100%; height: 100%; display: block;
               animation: twinkle 2.4s ease-in-out 1.7s infinite; }
  @keyframes sparkIn { from { transform: scale(0) rotate(-90deg); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes twinkle { 0%,100% { transform: scale(1) rotate(0); } 50% { transform: scale(.78) rotate(45deg); } }

  .rule { width: 110px; height: 7px; border-radius: 7px; background: var(--rose);
          margin: 40px 0 0 6px; transform-origin: 0 50%;
          animation: grow .8s var(--ease-io) .85s both; }
  @keyframes grow { from { transform: scaleX(0); } to { transform: none; } }

  .q {
    margin-top: 54px;
    font-family: "DM Sans", sans-serif; font-weight: 600;
    font-size: 70px; line-height: 1.17; letter-spacing: -0.025em; color: var(--plum);
    font-variation-settings: "opsz" 40;
  }
  .line { display: block; overflow: hidden; padding: 0 .2em .06em; margin: 0 -.2em -.06em; }
  .in { display: inline-block; transform-origin: 0 100%;
        animation: rise .85s var(--ease-out) var(--d) both; }

  .punch {
    margin-top: 26px;
    font-family: "Fraunces", serif; font-style: italic; font-weight: 600;
    font-size: 124px; line-height: 1.04; letter-spacing: -0.025em; color: var(--rose);
    font-variation-settings: "opsz" 144;
  }
  .punch .line { padding: 0 .2em .1em; margin: 0 -.2em -.1em; }
  .hl { position: relative; display: inline-block; }
  .hl .tx { position: relative; }
  .mk { position: absolute; left: -.1em; right: -.08em; top: .56em; bottom: .02em;
        background: var(--marker); border-radius: .08em;
        transform-origin: 0 50%; transform: skewX(-8deg);
        animation: swipe .6s var(--ease-io) var(--d) both; }
  @keyframes swipe { from { transform: skewX(-8deg) scaleX(0); } to { transform: skewX(-8deg) scaleX(1); } }

  /* ---------- poll cue ---------- */
  .cue { position: absolute; left: 0; right: 0; top: 1262px;
         display: flex; flex-direction: column; align-items: center; gap: 10px;
         font-family: "DM Sans", sans-serif; font-weight: 700; font-size: 30px;
         letter-spacing: .22em; text-transform: uppercase; color: var(--plum-soft);
         animation: fadeUp .7s var(--ease-out) 3.0s both; }
  .cue svg { width: 40px; height: 40px; display: block;
             animation: bob 1.1s ease-in-out 3.5s infinite; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(12px); } }
</style>
</head>
<body>
<div class="stage">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="ring"></div>

  <div class="content">
    <h1 class="honest">
      <span class="mask"><span class="w" style="--d:.15s">Be</span></span>
      <span class="mask"><span class="w" style="--d:.28s">honest</span></span><span class="dots"><i style="--d:.66s">.</i><i style="--d:.78s">.</i><i style="--d:.90s">.</i></span>
      <span class="spark" aria-hidden="true">
        <svg viewBox="0 0 64 64"><path d="M32 2 C34 22 42 30 62 32 C42 34 34 42 32 62 C30 42 22 34 2 32 C22 30 30 22 32 2 Z" fill="#B4335A"/></svg>
      </span>
    </h1>
    <div class="rule"></div>

    <p class="q">
      <span class="line"><span class="in" style="--d:1.05s">Before this series,</span></span>
      <span class="line"><span class="in" style="--d:1.17s">did you know</span></span>
      <span class="line"><span class="in" style="--d:1.29s">pregnancy preparation</span></span>
      <span class="line"><span class="in" style="--d:1.41s">should ideally begin</span></span>
    </p>

    <p class="punch">
      <span class="line"><span class="in" style="--d:1.75s"><span class="hl"><span class="mk" style="--d:2.45s"></span><span class="tx">before you</span></span></span></span>
      <span class="line"><span class="in" style="--d:1.90s"><span class="hl"><span class="mk" style="--d:2.70s"></span><span class="tx">start trying</span></span>?</span></span>
    </p>
  </div>

  <div class="cue">
    <span>Vote below</span>
    <svg viewBox="0 0 40 40" fill="none"><path d="M10 15 L20 25 L30 15" stroke="#B4335A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
</div>
</body>
</html>
