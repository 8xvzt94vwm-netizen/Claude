<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ask a Gynaecologist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700&family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,600&display=block" rel="stylesheet">
<style>
  /*
    Pre-pregnancy series · Story 04 — 1080 x 1920, 8s, mild pink
    Safe zones: top ~250px (profile bar), bottom ~240px (reply bar).
    "Ask me anything" sticker zone left clear: y ≈ 1410 – 1690.
  */
  :root {
    --ink: #3A2540;
    --ink-soft: #8A6F86;
    --rose: #C04A73;
    --tube: #DB6A90;
    --tube-hi: #F5B4C8;
    --pink: #F2B3C4;
    --pink-3: #FCEBF0;
    --marker: #F8D0DB;
    --ease-out: cubic-bezier(.16, 1, .3, 1);
    --ease-pop: cubic-bezier(.34, 1.56, .64, 1);
    --ease-io: cubic-bezier(.65, 0, .35, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #FFF8FA; }

  .stage {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: linear-gradient(180deg, #FFF9FB 0%, #FDF0F4 50%, #F9E4EB 100%);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- background ---------- */
  .blob { position: absolute; border-radius: 50%; }
  .b1 { width: 900px; height: 900px; left: 90px; top: 40px;
        background: radial-gradient(circle, rgba(247,196,212,.55) 0%, rgba(247,196,212,0) 66%);
        animation: drift1 9s ease-in-out infinite alternate; }
  .b2 { width: 760px; height: 760px; left: -420px; top: 900px;
        background: radial-gradient(circle, rgba(252,214,224,.75) 0%, rgba(252,214,224,0) 68%);
        animation: drift2 10s ease-in-out infinite alternate; }
  .b3 { width: 940px; height: 940px; right: -340px; bottom: -420px;
        background: radial-gradient(circle, rgba(242,179,196,.42) 0%, rgba(242,179,196,0) 68%);
        animation: drift3 11s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(-40px, 40px) scale(1.07); } }
  @keyframes drift2 { to { transform: translate(80px, -50px) scale(1.06); } }
  @keyframes drift3 { to { transform: translate(-60px, -70px) scale(1.05); } }

  .ring { position: absolute; width: 380px; height: 380px; left: -170px; top: 1380px;
          border: 2px solid rgba(192,74,115,.13); border-radius: 50%;
          animation: ringIn 1.4s var(--ease-out) .3s both, spin 24s linear infinite; }
  .ring::after { content: ""; position: absolute; width: 16px; height: 16px; border-radius: 50%;
                 background: var(--pink); top: 46px; right: 46px; }
  @keyframes ringIn { from { opacity: 0; scale: .7; } to { opacity: 1; scale: 1; } }
  @keyframes spin { to { rotate: 360deg; } }

  /* ---------- shared motion ---------- */
  @keyframes pop  { from { transform: scale(0); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes rise { from { transform: translateY(110%) rotate(5deg); } to { transform: none; } }
  @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes twinkle { 0%,100% { transform: scale(1) rotate(0); } 50% { transform: scale(.7) rotate(45deg); } }
  @keyframes turn { to { transform: rotate(180deg); } }
  .drawn { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw var(--dur, .5s) var(--ease, var(--ease-io)) var(--d) both; }

  /* ---------- hero: stethoscope heart ---------- */
  .hero { position: absolute; left: 280px; top: 212px; width: 520px; height: 485px; }
  .hero svg { width: 100%; height: 100%; overflow: visible; display: block; }
  .tip, .chest, .chest-beat, .ripple, .bubble, .dot, .qmark { transform-box: fill-box; transform-origin: 50% 50%; }
  .tubes { filter: drop-shadow(0 22px 26px rgba(192,74,115,.22)); }
  .tip { animation: pop .45s var(--ease-pop) var(--d) both; }
  .chest { animation: pop .6s var(--ease-pop) 1.3s both; }
  .chest-beat { animation: beat 1.2s ease-in-out 1.95s infinite; }
  @keyframes beat { 0%,100% { transform: scale(1); } 14% { transform: scale(1.09); } 28% { transform: scale(1); } 42% { transform: scale(1.05); } 56% { transform: scale(1); } }
  .ripple { opacity: 0; animation: ripple 1.2s ease-out var(--d) infinite; }
  @keyframes ripple { from { transform: scale(.9); opacity: .55; } to { transform: scale(1.9); opacity: 0; } }

  .bubble { transform-origin: 18% 100% !important; animation: pop .6s var(--ease-pop) 1.45s both; }
  .bubble-shadow { filter: drop-shadow(0 18px 22px rgba(192,74,115,.18)); }
  .dot { animation: typing .9s ease-in-out var(--d) 2 both, gone .2s ease 3.4s both; }
  @keyframes typing { 0%,60%,100% { transform: translateY(0); opacity: .55; } 30% { transform: translateY(-12px); opacity: 1; } }
  @keyframes gone { to { opacity: 0; transform: scale(0); } }
  .qmark { animation: qpop .65s var(--ease-pop) 3.45s both; }
  @keyframes qpop { from { transform: scale(0) rotate(-25deg); opacity: 0; } to { transform: none; opacity: 1; } }

  /* hearts floating up from the chest piece */
  .fh { position: absolute; width: 34px; height: 32px; left: 660px; top: 496px; opacity: 0;
        animation: floatUp 2.6s ease-out var(--d) infinite; }
  .fh svg { width: 100%; height: 100%; display: block; }
  @keyframes floatUp {
    0%   { transform: translate(0, 0) scale(.4); opacity: 0; }
    15%  { opacity: 1; }
    100% { transform: translate(var(--x), -230px) scale(1); opacity: 0; }
  }

  /* floating plus marks + sparkles */
  .deco { position: absolute; }
  .deco > div { width: 100%; height: 100%; animation: pop .7s var(--ease-pop) var(--d) both; }
  .deco svg { display: block; width: 100%; height: 100%; }
  .plus svg { animation: turn 6s var(--ease-io) var(--t) infinite alternate; }
  .spk svg  { animation: twinkle 2.4s ease-in-out var(--t) infinite; }

  /* ---------- chat bubbles ---------- */
  .chat { position: absolute; left: 100px; right: 80px; top: 732px; display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
  .msg { font: 600 44px/1 "DM Sans", sans-serif; letter-spacing: -0.02em; padding: 22px 34px 24px; border-radius: 44px;
         animation: msgIn .6s var(--ease-pop) var(--d) both; }
  @keyframes msgIn { from { transform: translateY(20px) scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
  .m1 { background: #fff; color: var(--ink); border-bottom-left-radius: 12px; transform-origin: 0 100%;
        box-shadow: 0 16px 30px -14px rgba(192,74,115,.3); }
  .m2 { margin-left: 70px; background: linear-gradient(135deg, #E98AAA, #D9668C); color: #fff;
        border-bottom-left-radius: 12px; transform-origin: 0 100%;
        box-shadow: 0 16px 30px -14px rgba(192,74,115,.45); }

  /* ---------- question ---------- */
  .text { position: absolute; left: 100px; right: 70px; top: 968px; }
  .line { display: block; overflow: hidden; padding: 0 .2em .12em; margin: 0 -.2em -.12em; }
  .in { display: inline-block; transform-origin: 0 100%; animation: rise .85s var(--ease-out) var(--d) both; }
  .q { font-family: "Fraunces", serif; font-style: italic; font-weight: 600; font-size: 68px;
       line-height: 1.08; letter-spacing: -0.02em; color: var(--rose); font-variation-settings: "opsz" 144; }
  .q .ink { color: var(--ink); }
  .one { position: relative; display: inline-block; font-style: normal; font-weight: 600; letter-spacing: .02em; }
  .one svg { position: absolute; left: -4%; width: 108%; bottom: -12px; height: 20px; overflow: visible; }

  /* ---------- sticker cue ---------- */
  .cue { position: absolute; left: 0; right: 0; top: 1318px;
         display: flex; flex-direction: column; align-items: center; gap: 10px;
         font: 700 30px/1 "DM Sans", sans-serif; letter-spacing: .22em; text-transform: uppercase;
         color: var(--ink-soft); animation: fadeUp .7s var(--ease-out) 3.6s both; }
  .cue svg { width: 40px; height: 40px; display: block; animation: drop 1.1s ease-in-out 4.1s infinite; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
  @keyframes drop { 0%,100% { transform: translateY(0); } 50% { transform: translateY(12px); } }
</style>
</head>
<body>
<div class="stage">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="ring"></div>

  <!-- decorative plus marks + sparkles -->
  <div class="deco plus" style="left:132px; top:330px; width:54px; height:54px; --t:1.4s"><div style="--d:.9s">
    <svg viewBox="0 0 54 54"><path d="M20 4 h14 a3 3 0 0 1 3 3 v13 h13 a3 3 0 0 1 3 3 v8 a3 3 0 0 1 -3 3 h-13 v13 a3 3 0 0 1 -3 3 h-14 a3 3 0 0 1 -3 -3 v-13 h-13 a3 3 0 0 1 -3 -3 v-8 a3 3 0 0 1 3 -3 h13 v-13 a3 3 0 0 1 3 -3 Z" fill="#F2B3C4"/></svg>
  </div></div>
  <div class="deco plus" style="left:880px; top:268px; width:40px; height:40px; --t:2s"><div style="--d:1.1s">
    <svg viewBox="0 0 54 54"><path d="M20 4 h14 a3 3 0 0 1 3 3 v13 h13 a3 3 0 0 1 3 3 v8 a3 3 0 0 1 -3 3 h-13 v13 a3 3 0 0 1 -3 3 h-14 a3 3 0 0 1 -3 -3 v-13 h-13 a3 3 0 0 1 -3 -3 v-8 a3 3 0 0 1 3 -3 h13 v-13 a3 3 0 0 1 3 -3 Z" fill="#E07A9A"/></svg>
  </div></div>
  <div class="deco spk" style="left:906px; top:520px; width:46px; height:46px; --t:1.7s"><div style="--d:1.25s">
    <svg viewBox="0 0 64 64"><path d="M32 2 C34 22 42 30 62 32 C42 34 34 42 32 62 C30 42 22 34 2 32 C22 30 30 22 32 2 Z" fill="#C04A73"/></svg>
  </div></div>
  <div class="deco spk" style="left:190px; top:640px; width:32px; height:32px; --t:2.2s"><div style="--d:1.4s">
    <svg viewBox="0 0 64 64"><path d="M32 2 C34 22 42 30 62 32 C42 34 34 42 32 62 C30 42 22 34 2 32 C22 30 30 22 32 2 Z" fill="#E07A9A"/></svg>
  </div></div>

  <!-- stethoscope drawn as a heart, with a "?" speech bubble inside -->
  <div class="hero">
    <svg viewBox="0 0 600 560">
      <defs>
        <radialGradient id="chestG" cx=".38" cy=".35" r=".75">
          <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F4E4EA"/>
        </radialGradient>
      </defs>

      <!-- tubing -->
      <g class="tubes" fill="none" stroke-linecap="round">
        <path class="drawn" pathLength="1" style="--d:.25s; --dur:1s" d="M250 92 C205 36 96 44 92 162 C88 268 196 344 300 446" stroke="#DB6A90" stroke-width="24"/>
        <path class="drawn" pathLength="1" style="--d:.25s; --dur:1s" d="M350 92 C395 36 504 44 508 162 C512 268 404 344 300 446" stroke="#DB6A90" stroke-width="24"/>
        <path class="drawn" pathLength="1" style="--d:1.0s; --dur:.45s; --ease:cubic-bezier(.3,0,.4,1)" d="M300 446 C300 500 336 530 386 518 C428 508 454 480 454 444" stroke="#DB6A90" stroke-width="22"/>
        <!-- gloss -->
        <path class="drawn" pathLength="1" style="--d:.32s; --dur:1s" d="M244 86 C203 44 110 52 106 160 C102 252 190 322 270 400" stroke="#F5B4C8" stroke-width="6" opacity=".9"/>
        <path class="drawn" pathLength="1" style="--d:.32s; --dur:1s" d="M356 86 C397 44 490 52 494 160 C498 252 410 322 330 400" stroke="#F5B4C8" stroke-width="6" opacity=".9"/>
      </g>
      <!-- Y-junction collar -->
      <rect class="tip" style="--d:1.0s" x="286" y="432" width="28" height="30" rx="10" fill="#C04A73"/>
      <!-- ear tips -->
      <g class="tip" style="--d:.1s"><rect x="245" y="82" width="34" height="48" rx="17" transform="rotate(-39 262 106)" fill="#4A2540"/></g>
      <g class="tip" style="--d:.1s"><rect x="321" y="82" width="34" height="48" rx="17" transform="rotate(39 338 106)" fill="#4A2540"/></g>

      <!-- chest piece -->
      <g class="chest"><g class="chest-beat">
        <circle class="ripple" style="--d:1.95s" cx="454" cy="396" r="54" fill="none" stroke="#DB6A90" stroke-width="4"/>
        <circle class="ripple" style="--d:2.35s" cx="454" cy="396" r="54" fill="none" stroke="#DB6A90" stroke-width="3"/>
        <rect x="442" y="436" width="24" height="18" rx="6" fill="#C04A73"/>
        <circle cx="454" cy="396" r="54" fill="url(#chestG)" stroke="#DB6A90" stroke-width="10"/>
        <circle cx="454" cy="396" r="34" fill="#FCE4EC"/>
        <path d="M454 413 C441 404 434 397 434 388 C434 382 439 377 445 377 C449 377 452 379 454 383 C456 379 459 377 463 377 C469 377 474 382 474 388 C474 397 467 404 454 413 Z" fill="#DB6A90"/>
      </g></g>

      <!-- speech bubble -->
      <g class="bubble-shadow"><g class="bubble">
        <path d="M232 178 H368 C392 178 410 196 410 220 V262 C410 286 392 304 368 304 H268 L238 330 L244 304 H232 C208 304 190 286 190 262 V220 C190 196 208 178 232 178 Z" fill="#fff"/>
        <circle class="dot" style="--d:1.9s"  cx="258" cy="241" r="12" fill="#E7A3B8"/>
        <circle class="dot" style="--d:2.05s" cx="300" cy="241" r="12" fill="#E7A3B8"/>
        <circle class="dot" style="--d:2.2s"  cx="342" cy="241" r="12" fill="#E7A3B8"/>
        <text class="qmark" x="300" y="281" text-anchor="middle" font-family="Fraunces" font-style="italic" font-weight="600" font-size="112" fill="#C04A73">?</text>
      </g></g>
    </svg>
  </div>

  <!-- little hearts rising from the chest piece -->
  <div class="fh" style="--d:2.1s; --x:40px"><svg viewBox="0 0 100 94"><path d="M50 90 C20 68 4 50 4 31 C4 16 15 5 29 5 C38.5 5 46 10.5 50 18.5 C54 10.5 61.5 5 71 5 C85 5 96 16 96 31 C96 50 80 68 50 90 Z" fill="#E98AAA"/></svg></div>
  <div class="fh" style="--d:2.9s; --x:110px; width:26px; height:24px"><svg viewBox="0 0 100 94"><path d="M50 90 C20 68 4 50 4 31 C4 16 15 5 29 5 C38.5 5 46 10.5 50 18.5 C54 10.5 61.5 5 71 5 C85 5 96 16 96 31 C96 50 80 68 50 90 Z" fill="#F2B3C4"/></svg></div>
  <div class="fh" style="--d:3.7s; --x:70px; width:30px; height:28px"><svg viewBox="0 0 100 94"><path d="M50 90 C20 68 4 50 4 31 C4 16 15 5 29 5 C38.5 5 46 10.5 50 18.5 C54 10.5 61.5 5 71 5 C85 5 96 16 96 31 C96 50 80 68 50 90 Z" fill="#DB6A90"/></svg></div>

  <!-- chat messages -->
  <div class="chat">
    <div class="msg m1" style="--d:.65s">One question.</div>
    <div class="msg m2" style="--d:1.15s">No awkwardness.</div>
  </div>

  <!-- question -->
  <div class="text">
    <p class="q">
      <span class="line"><span class="in" style="--d:1.70s"><span class="ink">If you could ask a</span></span></span>
      <span class="line"><span class="in" style="--d:1.82s"><span class="ink">gynaecologist</span> <span class="one">ONE<svg viewBox="0 0 120 22" preserveAspectRatio="none"><path class="drawn" pathLength="1" style="--d:2.7s; --dur:.5s" d="M3 14 C20 6 32 18 48 11 C64 4 76 18 92 11 C102 7 110 9 117 12" stroke="#E07A9A" stroke-width="5" fill="none" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg></span> thing</span></span>
      <span class="line"><span class="in" style="--d:1.94s">before planning a baby,</span></span>
      <span class="line"><span class="in" style="--d:2.06s">what would it be?</span></span>
    </p>
  </div>

  <div class="cue">
    <span>Ask away below</span>
    <svg viewBox="0 0 40 40" fill="none"><path d="M10 15 L20 25 L30 15" stroke="#C04A73" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
</div>
</body>
</html>
