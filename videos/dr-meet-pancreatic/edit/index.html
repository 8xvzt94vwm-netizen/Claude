<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Dr Meet Desai — pancreatic case (re-edit)</title>
<style>
  @font-face { font-family: "Fraunces"; font-weight: 500; src: url(fonts/fraunces-latin-500-normal.woff2) format("woff2"); }
  @font-face { font-family: "Fraunces"; font-weight: 600; src: url(fonts/fraunces-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family: "Fraunces"; font-weight: 700; src: url(fonts/fraunces-latin-700-normal.woff2) format("woff2"); }
  @font-face { font-family: "Fraunces"; font-weight: 600; font-style: italic; src: url(fonts/fraunces-latin-600-italic.woff2) format("woff2"); }
  :root {
    --navy: #0b1a21; --navy2: #10262f; --ink: #f6f1ea; --muted: #a9bcc4;
    --coral: #ff8a6b; --coral2: #ffb199; --mint: #7fe0c3; --gold: #ffd27a;
    --art: #ff6262; --vein: #62a8ff; --bile: #b6e04c;
  }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  * { box-sizing: border-box; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: var(--navy);
           font-family: Inter, system-ui, sans-serif; color: var(--ink);
           -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
  .layer { position: absolute; inset: 0; }

  /* ---------- footage ---------- */
  #docWrap { will-change: transform; }
  #doc { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 540px 120px;
         filter: contrast(1.04) saturate(1.04); }
  #docFade { background: #000; opacity: 0; }

  /* ---------- lower panel that replaces the old burned-in graphics ---------- */
  #panel { pointer-events: none; }
  #panel .grad { position: absolute; left: 0; right: 0; top: 1080px; bottom: 0;
    background: linear-gradient(180deg, rgba(11,26,33,0) 0px, rgba(11,26,33,.55) 110px, rgba(11,26,33,.93) 200px, #0b1a21 250px, #0b1a21 100%); }
  #panel .line { position: absolute; left: 90px; right: 90px; top: 1322px; height: 2px;
    background: linear-gradient(90deg, transparent, rgba(255,138,107,.55), transparent); }

  .cap { position: absolute; left: 60px; right: 60px; top: 1352px; text-align: center;
         font-family: Fraunces, serif; font-weight: 600; font-size: 62px; line-height: 1.12; letter-spacing: -.01em;
         color: var(--ink); text-shadow: 0 2px 18px rgba(0,0,0,.35); }
  .cap .w { display: inline-block; white-space: pre; }
  .cap .hl { color: var(--coral); }
  .cap .sub { display: block; margin-top: 16px; font-family: Inter, sans-serif; font-weight: 600; font-size: 30px;
              letter-spacing: .02em; color: var(--muted); }

  /* floating cards over the desk area while the doctor talks */
  .card { position: absolute; left: 70px; right: 70px; top: 1015px; height: 270px; border-radius: 34px;
          background: linear-gradient(180deg, rgba(16,38,47,.92), rgba(11,26,33,.94));
          border: 1.5px solid rgba(255,255,255,.10); box-shadow: 0 24px 60px rgba(0,0,0,.45); overflow: hidden; }

  /* ---------- brand header (covers the old burned-in title) ---------- */
  #brand { position: absolute; left: 0; top: 0; right: 0; height: 330px; pointer-events: none; }
  #brand .pill { position: absolute; left: 0; top: 138px; min-width: 450px; height: 164px; padding: 0 40px 0 48px; border-radius: 0 34px 34px 0;
     background: rgba(9,22,28,.86); border: 1.5px solid rgba(255,255,255,.10);
     backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
     border-left: none; box-shadow: 0 14px 40px rgba(0,0,0,.35); display: flex; align-items: center; gap: 20px; }
  #brand .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--coral); box-shadow: 0 0 0 6px rgba(255,138,107,.18); }
  #brand .nm { font-family: Fraunces, serif; font-weight: 600; font-size: 42px; line-height: 1; }
  #brand .rl { font-weight: 600; font-size: 22px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-top: 10px; }

  /* ---------- full-screen scenes ---------- */
  .scene { position: absolute; inset: 0; opacity: 0; visibility: hidden; overflow: hidden;
           background: radial-gradient(130% 75% at 50% 45%, #15343f 0%, #0d2029 48%, #08141a 100%); }
  .scene .topShade { position: absolute; left: 0; right: 0; top: 0; height: 700px; pointer-events: none;
     background: linear-gradient(180deg, rgba(8,20,26,.97) 0px, rgba(8,20,26,.9) 380px, rgba(8,20,26,.55) 560px, rgba(8,20,26,0) 700px); }
  .scene .botShade { position: absolute; left: 0; right: 0; bottom: 0; height: 420px; pointer-events: none;
     background: linear-gradient(0deg, rgba(8,20,26,.97) 0px, rgba(8,20,26,.85) 200px, rgba(8,20,26,0) 420px); }
  .scene .vig { position: absolute; inset: 0; background: radial-gradient(120% 70% at 50% 50%, transparent 60%, rgba(0,0,0,.45)); pointer-events: none; }
  .kicker { position: absolute; left: 0; right: 0; top: 330px; text-align: center; font-weight: 700; font-size: 26px;
            letter-spacing: .26em; text-transform: uppercase; color: var(--coral); }
  .title { position: absolute; left: 70px; right: 70px; top: 362px; text-align: center; font-family: Fraunces, serif;
           font-weight: 600; font-size: 70px; line-height: 1.08; letter-spacing: -.015em; color: var(--ink); }
  .title .hl { color: var(--coral); }
  .stitle { position: absolute; left: 70px; right: 70px; text-align: center; font-family: Fraunces, serif; font-weight: 600;
            font-size: 58px; line-height: 1.12; color: var(--ink); }
  .stitle .hl { color: var(--coral); }
  .note { position: absolute; left: 0; right: 0; text-align: center; font-weight: 600; font-size: 22px; letter-spacing: .14em;
          text-transform: uppercase; color: rgba(169,188,196,.65); }
  svg text { font-family: Inter, sans-serif; }
  .lbl { font-family: Inter, sans-serif; font-weight: 700; fill: #fff; }
  .lblS { font-family: Inter, sans-serif; font-weight: 600; fill: var(--muted); }

  /* journey tracker shown on the medical scenes */
  .journey { position: absolute; left: 90px; right: 90px; top: 1640px; height: 120px; }
</style>
<script src="lib/gsap.min.js"></script>
<script src="anatomy.js"></script>
</head>
<body>
<div id="stage">
  <div id="docWrap" class="layer"><img id="doc" alt=""></div>
  <div id="panel" class="layer"><div class="grad"></div><div class="line"></div><div id="caps"></div><div id="cards"></div></div>
  <div id="scenes" class="layer"></div>
  <div id="docFade" class="layer"></div>
  <div id="brand"><div class="pill"><div class="dot"></div><div><div class="nm">Dr Meet Desai</div><div class="rl">GI &amp; HPB Surgeon</div></div></div></div>
</div>
<script src="core.js"></script>
<script src="captions.js"></script>
<script src="scenes.js"></script>
<script src="cards.js"></script>
<script>BUILD();</script>
</body>
</html>
